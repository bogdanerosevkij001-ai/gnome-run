<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a8d8c8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Беги от гномов</title>
<style>
:root{--sky:#c9ead6;--sky2:#7fc4d8;--cloud:rgba(255,255,255,.88);--sun:#fff3b0;--grass:#3d7a3a;--road:#8a6a45;--road2:#947450;--t1:#2d6a3a;--t2:#3f8a4a;--ink:#1d2a1a;--bg:#7fc4d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#1d3a33;--sky2:#0c1a2a;--cloud:rgba(150,180,220,.22);--sun:#dfe9ff;--grass:#1b3a22;--road:#4a3a28;--road2:#523f2b;--t1:#12301c;--t2:#1b4a2a;--ink:#e6efe0;--bg:#0c1a2a}}
:root[data-theme="dark"]{--sky:#1d3a33;--sky2:#0c1a2a;--cloud:rgba(150,180,220,.22);--sun:#dfe9ff;--grass:#1b3a22;--road:#4a3a28;--road2:#523f2b;--t1:#12301c;--t2:#1b4a2a;--ink:#e6efe0;--bg:#0c1a2a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:fixed;inset:0;flex-direction:column;align-items:center;color:#fff;text-align:center;padding:24px;overflow:auto;gap:11px}
.ov::before,.ov::after{content:"";flex:1 0 0}
#menu{display:flex;background:linear-gradient(180deg,rgba(4,18,10,.25),rgba(4,18,10,.7))}
#shop,#board,#nameov{display:none;background:rgba(10,20,12,.94)}
#nameov{z-index:5}
#pb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
#pause{display:none;background:rgba(10,20,12,.85);z-index:4}
#auth{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.85;text-shadow:0 1px 3px #000}
input{font:18px system-ui,sans-serif;width:240px;max-width:90%;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;text-align:center}
#er{color:#ff8a80;min-height:20px;margin:0;max-width:300px}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes pul{0%,100%{box-shadow:0 4px 0 #9a5d00,0 0 0 0 rgba(255,214,90,.65)}70%{box-shadow:0 4px 0 #9a5d00,0 0 0 18px rgba(255,214,90,0)}}
#menu h1{margin:0;font-size:42px;line-height:1.05;background:linear-gradient(180deg,#fff6c2,#ffb52e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6b3d00) drop-shadow(0 8px 10px rgba(0,0,0,.5));animation:flt 3.2s ease-in-out infinite}
#menu .btn{animation:up .6s both}
#menu .btn:nth-of-type(2){animation-delay:.2s}#menu .btn:nth-of-type(3){animation-delay:.3s}#menu .btn:nth-of-type(4){animation-delay:.4s}#menu .btn:nth-of-type(5){animation-delay:.5s}
#play{background:linear-gradient(180deg,#ffd84d,#f0a020);color:#4a2a00;font-size:21px;box-shadow:0 4px 0 #9a5d00;animation:up .6s .1s both,pul 2s 1s infinite}
#menu p{margin:0;max-width:320px;line-height:1.4}
.btn{font:700 17px system-ui,sans-serif;min-width:220px;padding:12px 22px;border:0;border-radius:16px;background:linear-gradient(180deg,#5fbf72,#2f7a40);box-shadow:0 4px 0 #1d5230,0 8px 14px rgba(0,0,0,.35);color:#fff;transition:transform .1s}.btn:active{transform:translateY(3px) scale(.98)}
.btn.alt{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 6px 12px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn:disabled{opacity:.45}
.row{display:flex;align-items:center;gap:12px;width:100%;max-width:380px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.row .l{flex:1;text-align:left}
.row .btn{min-width:112px;padding:9px 10px;font-size:15px}
.sw{width:34px;height:34px;border-radius:50%;flex:none;background:#555}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu" class="ov"><h1 id="mt">Беги от гномов</h1><p id="ms">Свайп вверх: прыжок. Свайп вниз: скольжение. Свайп вбок: смена дорожки. Собирай монеты и не подпускай гномов.</p>
<button class="btn" id="play">Играть</button><button class="btn alt" id="boardb">Рейтинг</button><button class="btn alt" id="shopb">Магазин</button><button class="btn alt" id="snd">Звук: вкл</button><button class="btn alt" id="namech">Сменить имя</button>
<p id="best"></p><div id="auth">Автор: Бодя балтон</div></div>
<div id="shop" class="ov"><h2 style="margin:0 0 4px">Магазин</h2><p id="coins" style="margin:0 0 10px"></p><div id="items" style="width:100%;display:flex;flex-direction:column;align-items:center"></div><button class="btn alt" id="back" style="margin-top:16px">Назад</button></div>
<div id="board" class="ov"><h2 style="margin:0">Рейтинг</h2><p id="bst" style="margin:0;font-size:14px;opacity:.8;max-width:320px"></p><div id="bl2" style="width:100%;max-width:380px"></div><button class="btn alt" id="bback">Назад</button></div>
<button id="pb">⏸</button>
<div id="pause" class="ov"><h2 style="margin:0">Пауза</h2><button class="btn" id="pres">Продолжить</button><button class="btn alt" id="pexit">В меню</button></div>
<div id="nameov" class="ov"><h2 style="margin:0">Как тебя зовут?</h2><p style="margin:0;max-width:300px">Это имя увидят другие игроки в рейтинге.</p><input id="nm" maxlength="12" placeholder="Твоё имя" autocomplete="off"><input id="cd" placeholder="Секретный код" autocomplete="off" style="display:none"><p id="er"></p><button class="btn" id="nok">Готово</button><button class="btn alt" id="ncancel" style="display:none">Отмена</button></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');
const L=60,ZM=220,MAXG=45,JV=620,GR=1800;
const HEROES=[['#2f6fdb','#5a3a22'],['#d6423a','#222'],['#8a4fd0','#e0b030'],['#2a9d6a','#e8e8e8']];
const SKINS=[['Синий герой',0],['Красный герой',40],['Фиолетовый герой',80],['Зелёный герой',120]];
const UPS=[{k:'mg',n:'Магнит монет',p:[50,100,150]},{k:'sh',n:'Щит от удара',p:[80,160]}];
const HATS=['#c8372d','#e08a1e','#3a6fd8','#a03ad0'];
let W,H,F,HOR,HC,hk=.3,cb=0;
function setCam(){HOR=H*hk;HC=(H*.8-HOR)*ZM/F+cb}
function resize(){
  const d=window.devicePixelRatio||1;
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  F=Math.min(H*.8,.85*W/(3.2*L)*ZM);setCam();
}
addEventListener('resize',resize);resize();
const P=(x,y,z)=>{z=Math.max(z,40);return[W/2+x*F/z,HOR+(HC-y)*F/z]};
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const ss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let S={coins:0,best:0,hero:0,owned:[0],mg:0,sh:0,mute:0,name:'',vip:0,pid:''};
try{Object.assign(S,JSON.parse(ls('gnome-save')||'{}'))}catch(e){}
if(!ls('gnome-save')){S.coins=+ls('gnome-coins')||0;S.best=+ls('gnome-best')||0;S.hero=+ls('gnome-hero')||0;S.mute=ls('gnome-mute')==='1'?1:0;if(S.hero)S.owned.push(S.hero)}
const save=()=>ss('gnome-save',JSON.stringify(S));
if(!S.pid){S.pid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);save()}
// Адрес онлайн-базы Firebase Realtime Database вида https://имя-default-rtdb.firebaseio.com
const DB='';
let bd={},es=null,conn=false;
let paused=false,flyT=0,pwr=[],gy=0;
function pauseGame(){if(state!=='play'||paused)return;paused=true;$('pause').style.display='flex'}
function resumeGame(){$('pause').style.display='none';paused=false}
$('pb').onclick=pauseGame;$('pres').onclick=resumeGame;
$('pexit').onclick=()=>{
  $('pause').style.display='none';paused=false;
  const sc=Math.floor(dist/15);
  S.coins+=cn;const imp=sc>S.best;if(imp)S.best=sc;save();if(imp)submit();
  state='menu';showMenu('Беги от гномов','Свайп вверх: прыжок. Свайп вниз: скольжение. Свайп вбок: смена дорожки. Собирай монеты и не подпускай гномов.',false);
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(paused&&$('pause').style.display==='flex')resumeGame();else pauseGame()}});

let state='menu',t=0,dist=0,speed=450,gapz=MAXG,inv=0,lane=0,px=0,gx1=0,gx2=0,sh=0;
let man={y:0,vy:0,sl:0},obs=[],coins=[],trees=[],nextZ=0,cn=0,gh=0,lvl=1,lvT=0,mt=0,mi=0;

// звук
let ac=null;
function tone(f,d,ty,v,f2){
  if(S.mute)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=ty||'square';o.frequency.setValueAtTime(f,n);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
    g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d);
  }catch(e){}
}
const BASS=[110,110,165,110,147,147,196,147];
function music(dt){
  mt-=dt;if(mt>0)return;
  mt=Math.max(.12,.22-lvl*.015);
  const f=BASS[mi%8];tone(f,.18,'triangle',.07);
  if(mi%4===2)tone(f*4,.1,'square',.02);
  mi++;
}

// меню и магазин
function bestText(){const r=rankOf();$('best').textContent=(S.name?S.name+'. ':'')+'Рекорд: '+S.best+' м, монет: '+S.coins+(r?', место: '+r:'')}
function showMenu(title,text,again){
  flyT=0;
  $('mt').textContent=title;$('ms').textContent=text;bestText();
  $('play').textContent=again?'Играть снова':'Играть';
  $('menu').style.display='flex';$('shop').style.display='none';$('board').style.display='none';$('pb').style.display='none';$('pause').style.display='none';
}
function row(sw,label,btn,dis,fn){
  const r=document.createElement('div');r.className='row';
  r.innerHTML='<div class="sw"></div><span class="l"></span><button class="btn"></button>';
  if(sw)r.firstChild.style.background=sw;else r.firstChild.style.visibility='hidden';
  r.children[1].textContent=label;
  const b=r.children[2];b.textContent=btn;b.disabled=dis;b.onclick=fn;
  $('items').appendChild(r);
}
function shop(){
  $('items').innerHTML='';$('coins').textContent='Монеты: '+S.coins;
  SKINS.forEach((s,i)=>{
    const own=S.owned.includes(i);
    row(HEROES[i][0],s[0],own?(S.hero===i?'Выбрано':'Выбрать'):'🪙 '+s[1],own?S.hero===i:S.coins<s[1],()=>{
      if(own)S.hero=i;else{S.coins-=s[1];S.owned.push(i);S.hero=i;tone(880,.15,'square',.05,1320)}
      save();shop();
    });
  });
  UPS.forEach(u=>{
    const lv=S[u.k],mx=u.p.length;
    row(null,u.n+' ('+lv+'/'+mx+')',lv>=mx?'Максимум':'🪙 '+u.p[lv],lv>=mx||S.coins<u.p[lv],()=>{
      S.coins-=u.p[lv];S[u.k]++;tone(880,.15,'square',.05,1320);save();shop();
    });
  });
}
$('shopb').onclick=()=>{shop();$('menu').style.display='none';$('shop').style.display='flex'};
$('back').onclick=()=>{bestText();$('shop').style.display='none';$('menu').style.display='flex'};
$('play').onclick=reset;
$('snd').onclick=()=>{S.mute=S.mute?0:1;save();$('snd').textContent='Звук: '+(S.mute?'выкл':'вкл')};
$('snd').textContent='Звук: '+(S.mute?'выкл':'вкл');
bestText();

function initTrees(){trees=[];for(let z=120;z<2200;z+=55)addTree(z)}
function addTree(z){trees.push({z,x:(Math.random()<.5?-1:1)*(1.9*L+Math.random()*4*L),s:.8+Math.random()*.6})}
initTrees();

// ===== имя, цензура, рейтинг =====
//BEGIN-FILTER
const h53=s=>{let a=3735928559,b=1103547991;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const rep=s=>s.replace(/(.)\1+/g,'$1');
const LA={a:'а',e:'е',o:'о',p:'р',c:'с',x:'х',y:'у',k:'к',h:'н',b:'в',t:'т',m:'м'};
const CL={'а':'a','е':'e','о':'o','р':'p','с':'c','х':'x','у':'y','к':'k','н':'h','в':'b','т':'t','м':'m'};
const TR={a:'а',b:'б',c:'с',d:'д',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'й',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'к',r:'р',s:'с',t:'т',u:'у',v:'в',w:'в',x:'кс',y:'и',z:'з'};
const lo=s=>s.toLowerCase().replace(/ё/g,'е');
const nA=s=>rep(lo(s).replace(/[a-z]/g,c=>LA[c]||c).replace(/[^а-я]/g,''));
const nB=s=>rep(lo(s).replace(/[а-я]/g,c=>CL[c]||'').replace(/[^a-z]/g,''));
const nC=s=>rep(lo(s).replace(/[a-z]/g,c=>TR[c]).replace(/[^а-я]/g,''));
const BADA=['гитлер','гимлер','геббельс','муссолини','чикатил','чикотил','потрошител','пичушкин','бинладен','брейвик','тедбанди','нацист','нацизм','свастик','педофил','изнасилов','хуй','хуе','хуя','пизд','ебан','ебат','ебал','бляд','блят','сука','сучка','мудак','мудил','гандон','гондон','залуп','шлюх','пидор','пидар','пидр','говн','дерьм'].map(rep);
const BADB=['hitler','gitler','himmler','goebbels','mussolini','chikatilo','tedbundy','dahmer','breivik','binladen','nazism','nazist','swastika','fuck','shit','bitch','cunt','nigger','nigga','faggot','whore','pedophile','rapist'].map(rep);
const BADC=['хитлер','схикатил','схикотил','хикатил','хикотил','чикатил','чикотил'].map(rep);
const bad=n=>{const a=nA(n),b=nB(n),c=nC(n);return BADA.some(w=>a.includes(w))||BADB.some(w=>b.includes(w))||BADC.some(w=>c.includes(w))};
const reserved=n=>{const a=nA(n),b=nB(n),c=nC(n);return a.includes('богдан')||c.includes('богдан')||c.includes('бохдан')||b.includes('bogdan')};
const codeOk=s=>h53('gr'+lo(s).replace(/[^а-яa-z0-9]/g,''))==='lh920jgas6';
//END-FILTER
const shown=r=>{
  const n=r.n;
  if(typeof n!=='string'||n.length>14||bad(n))return'***';
  if(reserved(n)&&!r.v)return'Игрок';
  return n;
};
function askName(first){
  $('nm').value=S.name||'';$('cd').value='';$('cd').style.display='none';$('er').textContent='';
  $('ncancel').style.display=first?'none':'block';
  $('nameov').style.display='flex';
}
$('namech').onclick=()=>askName(false);
$('ncancel').onclick=()=>{$('nameov').style.display='none'};
$('nok').onclick=()=>{
  const v=$('nm').value.trim().replace(/\s+/g,' '),er=m=>{$('er').textContent=m};
  if(!/^[A-Za-zА-Яа-яЁё0-9 _-]{2,12}$/.test(v))return er('Имя: от 2 до 12 символов, буквы, цифры, пробел, _ или -');
  if(bad(v))return er('Это имя нельзя использовать, выбери другое');
  let vip=0;
  if(reserved(v)){
    $('cd').style.display='block';
    if(!$('cd').value)return er('Это имя защищено. Введи секретный код или выбери другое имя');
    if(!codeOk($('cd').value))return er('Неверный код');
    vip=1;
  }
  S.name=v;S.vip=vip;save();$('nameov').style.display='none';bestText();submit();renderBoard();
};

function applyEv(e){
  try{
    const d=JSON.parse(e.data),put=e.type==='put';
    if(d.path==='/'){if(put)bd=d.data||{};else Object.assign(bd,d.data)}
    else{
      const pt=d.path.split('/').filter(Boolean),id=pt[0];
      if(pt.length===1){if(put){if(d.data===null)delete bd[id];else bd[id]=d.data}else bd[id]=Object.assign(bd[id]||{},d.data)}
      else{bd[id]=bd[id]||{};bd[id][pt[1]]=d.data}
    }
  }catch(x){}
  renderBoard();bestText();
}
function connect(){
  if(!DB||es||!window.EventSource)return;
  es=new EventSource(DB+'/scores.json');
  es.addEventListener('open',()=>{conn=true;renderBoard()});
  es.addEventListener('error',()=>{conn=false;renderBoard()});
  es.addEventListener('put',applyEv);es.addEventListener('patch',applyEv);
}
function list(){
  if(!DB)return S.name&&S.best>0?[{id:S.pid,n:S.name,s:S.best}]:[];
  return Object.entries(bd).filter(([id,r])=>r&&typeof r.s==='number').map(([id,r])=>({id,n:shown(r),s:r.s})).sort((a,b)=>b.s-a.s);
}
function rankOf(){const i=list().findIndex(r=>r.id===S.pid);return i>=0&&S.best>0?i+1:0}
function renderBoard(){
  if($('board').style.display!=='flex')return;
  $('bst').textContent=!DB?'Рейтинг пока виден только на этом телефоне: онлайн-база ещё не подключена':conn?'Онлайн, обновляется в реальном времени':'Подключаюсь…';
  const el=$('bl2');el.innerHTML='';
  list().slice(0,20).forEach((r,i)=>{
    const d=document.createElement('div');d.className='row';
    d.innerHTML='<b style="width:28px"></b><span class="l"></span><b></b>';
    d.children[0].textContent=i+1;d.children[1].textContent=r.n;d.children[2].textContent=r.s+' м';
    if(r.id===S.pid)d.style.background='rgba(63,143,78,.35)';
    el.appendChild(d);
  });
}
function submit(){
  if(!DB||!S.name||S.best<=0)return;
  try{fetch(DB+'/scores/'+S.pid+'.json',{method:'PUT',body:JSON.stringify({n:S.name,s:S.best,v:S.vip?1:0}),keepalive:true})}catch(e){}
}
$('boardb').onclick=()=>{$('menu').style.display='none';$('board').style.display='flex';connect();renderBoard()};
$('bback').onclick=()=>{$('board').style.display='none';bestText();$('menu').style.display='flex'};
if(!S.name)askName(true);
connect();bestText();

function reset(){
  state='play';dist=0;speed=450;gapz=MAXG;inv=0;lane=0;px=gx1=gx2=0;cn=0;lvl=1;lvT=0;mi=0;mt=0;sh=S.sh;flyT=0;pwr=[];gy=0;cb=0;paused=false;$('pause').style.display='none';$('pb').style.display='block';
  man.y=0;man.vy=0;man.sl=0;obs=[];coins=[];nextZ=900;gh=Math.floor(Math.random()*HATS.length);
  $('menu').style.display='none';
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
}
function caught(){
  if(state!=='play')return;
  state='over';tone(220,.5,'sawtooth',.08,50);
  const sc=Math.floor(dist/15);
  S.coins+=cn;const imp=sc>S.best;if(imp)S.best=sc;save();if(imp)submit();
  showMenu('Гномы поймали!','Ты пробежал '+sc+' м и собрал монет: '+cn,true);
}
const jump=()=>{if(state==='play'&&man.y===0&&man.sl<=0){man.vy=JV;tone(300,.15,'square',.05,600)}};
const slide=()=>{
  if(state!=='play'||paused||flyT>0)return;
  if(man.y>0)man.vy=-800;else if(man.sl<=0){man.sl=.7;tone(400,.2,'sawtooth',.04,150)}
};
const trainAt=l=>obs.find(o=>o.type==='train'&&o.lane===l&&o.z-16<ZM&&o.z+o.d>ZM-6);
const changeLane=d=>{
  if(state!=='play')return;
  const nl=Math.max(-1,Math.min(1,lane+d));
  if(nl===lane)return;
  if(trainAt(nl)){if(inv<=0)hurt({type:'side'});else tone(120,.1,'sawtooth',.05);return}
  lane=nl;tone(200,.06,'triangle',.05);
};
let sx=0,sy=0,fired=true;
cv.addEventListener('pointerdown',e=>{e.preventDefault();sx=e.clientX;sy=e.clientY;fired=false});
cv.addEventListener('pointermove',e=>{
  if(fired)return;
  const a=e.clientX-sx,b=e.clientY-sy;
  if(Math.abs(a)<28&&Math.abs(b)<28)return;
  fired=true;
  if(Math.abs(a)>Math.abs(b))changeLane(a>0?1:-1);else if(b>0)slide();else jump();
});
cv.addEventListener('pointerup',()=>{if(!fired){fired=true;jump()}});
cv.addEventListener('pointercancel',()=>{fired=true});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}
  if(e.code==='ArrowDown')slide();
  if(e.code==='ArrowLeft')changeLane(-1);
  if(e.code==='ArrowRight')changeLane(1);
});

const DEP={train:260,ramp:60,crate:30,gantry:20};
const HIT={spike:()=>man.y<30,low:()=>man.y<28,bar:()=>man.sl<=0&&man.y<52,train:()=>man.y<100,crate:()=>man.y<45,chevron:()=>man.y<60,signal:()=>man.y<125,gantry:()=>man.sl<=0&&man.y<60,ramp:()=>false};
function spawn(){
  if(flyT>0){
    const h=flyT>0?170:0;
    for(const l of[-1,0,1])for(let i=0;i<6;i++)coins.push({z:nextZ+i*40,lane:l,h});
    nextZ+=320;return;
  }
  const pool=['spike','low','crate','chevron'];
  if(lvl>=2)pool.push('bar','signal','ramp');
  if(lvl>=3)pool.push('train','train','gantry');
  const type=pool[Math.floor(Math.random()*pool.length)];
  const n=type==='gantry'?1:1+(Math.random()<.3+lvl*.04?1:0);
  const lanes=[-1,0,1].sort(()=>Math.random()-.5);
  for(const l of lanes.slice(0,n))obs.push({z:nextZ,lane:type==='gantry'?0:l,type,d:DEP[type]||0});
  const free=type==='gantry'?[]:lanes.slice(n);
  if(free.length&&Math.random()<.65){
    const cl=free[Math.floor(Math.random()*free.length)];
    for(let i=0;i<5;i++)coins.push({z:nextZ+i*40,lane:cl});
  }
  if(Math.random()<.035)pwr.push({z:nextZ+110,lane:free.length?free[0]:0});
  nextZ+=speed*(.8+Math.random()*.7)*Math.max(.6,1-lvl*.06)+160+(type==='train'?260:0);
}
function hurt(o){
  inv=1.2;
  if(sh>0){sh--;tone(600,.2,'triangle',.06)}
  else{gapz-=15;tone(150,.3,'sawtooth',.08,60)}
  if(o.type==='train'){const c=[-1,0,1].filter(l=>l!==lane&&!trainAt(l));if(c.length)lane=c[Math.floor(Math.random()*c.length)]}
  if(gapz<=8)caught();
}
function update(dt){
  t+=dt;
  if(paused)return;
  const k3=Math.min(1,3*dt);
  hk+=((flyT>0?.4:.3)-hk)*k3;cb+=((flyT>0?90:0)-cb)*k3;gy+=((flyT>0?165:0)-gy)*k3;setCam();
  for(const c of clouds)c.x=(c.x-c.v*dt*(flyT>0?6:1)+1)%1;
  if(flyT>0)for(const c of fcl){c.y+=dt*(.7+c.s*.3);if(c.y>1.2){c.y=-.2;c.x=Math.random()}}
  const sp=state==='play'?speed:140;
  for(const tr of trees){tr.z-=sp*dt;if(tr.z<80){tr.z=2200+Math.random()*60;tr.x=(Math.random()<.5?-1:1)*(1.9*L+Math.random()*4*L)}}
  if(state!=='play'){
    dist+=sp*dt;px=Math.sin(t*.9)*L*.8;man.y=0;man.sl=0;inv=0;gapz=Math.min(MAXG,gapz+12*dt);
    gx1+=(px-gx1)*Math.min(1,5*dt);gx2+=(gx1-gx2)*Math.min(1,4*dt);
    return;
  }
  speed=Math.min(950,450+dist/60);
  dist+=speed*dt;
  const nl=1+Math.floor(dist/15/250);
  if(nl!==lvl){lvl=nl;lvT=2;tone(500,.3,'square',.06,1000)}
  if(lvT>0)lvT-=dt;
  px+=(lane*L-px)*Math.min(1,12*dt);
  gx1+=(px-gx1)*Math.min(1,5*dt);
  gx2+=(gx1-gx2)*Math.min(1,4*dt);
  if(man.sl>0)man.sl-=dt;
  if(flyT>0){flyT-=dt;man.y+=(170-man.y)*Math.min(1,4*dt);man.vy=0;man.sl=0}
  else if(man.y>0||man.vy!==0){man.vy-=GR*dt;man.y+=man.vy*dt;if(man.y<=0){man.y=0;man.vy=0}}
  for(const o of obs)o.z-=(speed+(o.type==='train'?150:0))*dt;
  for(const c of coins)c.z-=speed*dt;
  nextZ-=speed*dt;
  obs=obs.filter(o=>o.z+o.d>90);
  coins=coins.filter(c=>c.z>90);
  if(nextZ<=1900)spawn();
  const mg=S.mg;
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(Math.abs(c.z-ZM)<18+mg*30&&Math.abs(px-c.lane*L)<26+mg*30&&(c.h?man.y>c.h-70:man.y<60)){coins.splice(i,1);cn++;tone(880,.1,'square',.04,1320)}
  }
  for(const p of pwr)p.z-=speed*dt;
  pwr=pwr.filter(p=>p.z>90);
  for(let i=pwr.length-1;i>=0;i--){
    const p=pwr[i];
    if(Math.abs(p.z-ZM)<22&&Math.abs(px-p.lane*L)<30&&man.y<100){pwr.splice(i,1);flyT=10;obs=[];tone(500,.5,'square',.06,1400)}
  }
  if(flyT<=0)for(const o of obs){
    if(o.type==='ramp'&&!o.used&&Math.abs(px-o.lane*L)<26&&Math.abs(o.z-ZM)<16&&man.y<30){
      o.used=true;man.vy=950;tone(400,.3,'square',.06,1200);
      for(let i=0;i<6;i++)coins.push({z:o.z+80+i*45,lane:o.lane,h:140});
    }
  }
  gapz=Math.min(MAXG,gapz+Math.max(1.5,3-lvl*.2)*dt);
  if(inv>0)inv-=dt;
  if(gapz<=8)caught();
  music(dt);
  if(inv<=0&&state==='play'&&flyT<=0){
    for(const o of obs){
      if((o.type!=='gantry'&&Math.abs(px-o.lane*L)>=24)||Math.abs(o.z-ZM)>=14)continue;
      if(HIT[o.type]()){hurt(o);break}
    }
  }
}

const C={};
function quad(a,b,c,d,col){
  cx.fillStyle=col;cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.lineTo(c[0],c[1]);cx.lineTo(d[0],d[1]);cx.closePath();cx.fill();
}
const band=(z0,z1,x0,x1,col)=>quad(P(x0,0,z0),P(x1,0,z0),P(x1,0,z1),P(x0,0,z1),col);
const rect=(x0,x1,y0,y1,z,col)=>quad(P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z),col);
const fog=z=>Math.max(.05,Math.min(1,(2000-z)/700));
function tri(x,z,w,y0,y1,col){
  const a=P(x-w/2,y0,z),b=P(x+w/2,y0,z),c=P(x,y1,z);
  cx.fillStyle=col;cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.lineTo(c[0],c[1]);cx.fill();
}
function tree(o){
  cx.globalAlpha=fog(o.z);const s=o.s;

  tri(o.x,o.z,60*s,25*s,105*s,C.t1);
  tri(o.x,o.z,46*s,65*s,150*s,C.t2);
  for(const [w,y0,y1] of[[60*s,25*s,105*s],[46*s,65*s,150*s]]){
    const a=P(o.x,y0,o.z),b=P(o.x+w/2,y0,o.z),c=P(o.x,y1,o.z);
    cx.fillStyle='rgba(255,255,255,.13)';cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.lineTo(c[0],c[1]);cx.fill();
  }

}

function person(x,y,z,run,kind,sl){
  const s=F/z*1.3,[sx,sy]=P(x,y,z);
  cx.save();
  cx.fillStyle='rgba(0,0,0,.25)';
  const [shx,shy]=P(x,0,z);
  cx.beginPath();cx.ellipse(shx,shy,16*s,5*s,0,0,7);cx.fill();
  cx.translate(sx,sy);cx.scale(s,sl>0?s*.55:s);
  const l=Math.sin(run*14)*7,air=y>2;
  cx.strokeStyle='#23301f';cx.lineWidth=4;cx.lineCap='round';
  cx.beginPath();
  cx.moveTo(-3,-14);cx.lineTo(air?-6:-3-l,air?-4:0);
  cx.moveTo(3,-14);cx.lineTo(air?6:3+l,0);
  cx.stroke();
  face(kind==='man'?'man':'gnome');
  if(kind!=='man'){
    cx.fillStyle=kind;cx.beginPath();cx.moveTo(-10,-36);cx.lineTo(10,-36);cx.lineTo(2,-58);cx.fill();
    cx.fillStyle='rgba(0,0,0,.35)';cx.fillRect(-10,-38,20,3);

}

  cx.fillStyle='rgba(255,255,255,.75)';cx.beginPath();cx.ellipse(-1.6,-12,1.4,3.5,0,0,7);cx.fill();

function ramp(o){

  quad(P(x+24,0,z),P(x+24,50,z+60),P(x+24,0,z+60),P(x+24,0,z),'#2f5f9a');
  quad(P(x-24,0,z),P(x+24,0,z),P(x+24,50,z+60),P(x-24,50,z+60),'#d9a35b');
  for(let i=1;i<5;i++){const k=i/5;quad(P(x-24,50*k,z+60*k),P(x+24,50*k,z+60*k),P(x+24,50*k+2,z+60*k),P(x-24,50*k+2,z+60*k),'#a8743a')}
  cx.globalAlpha=1;
}

function draw(){
  const cs=getComputedStyle(document.documentElement);
  for(const k of['sky','sky2','grass','road','road2','t1','t2','cloud','sun'])C[k]=cs.getPropertyValue('--'+k).trim();
  const g=cx.createLinearGradient(0,0,0,HOR);g.addColorStop(0,C.sky2);g.addColorStop(1,C.sky);
  cx.fillStyle=g;cx.fillRect(0,0,W,HOR);
  const sg=cx.createRadialGradient(W*.75,HOR*.45,0,W*.75,HOR*.45,W*.55);
  sg.addColorStop(0,'rgba(255,245,190,.55)');sg.addColorStop(1,'rgba(255,245,190,0)');
  cx.fillStyle=sg;cx.fillRect(0,0,W,HOR);
  cx.fillStyle=C.sun;cx.beginPath();cx.arc(W*.75,HOR*.45,Math.min(30,W*.07),0,7);cx.fill();
  cx.fillStyle=C.cloud;
  for(const c of clouds)cloudAt(c.x*W*1.4-W*.2,c.y*HOR,c.s*(W*.04+8));
  cx.fillStyle=C.t1;cx.globalAlpha=.55;
  for(let i=0;i<6;i++){cx.beginPath();cx.ellipse(W*i/4.5,HOR+4,W*.28,HOR*.3,0,Math.PI,0);cx.fill()}
  cx.globalAlpha=1;
  cx.fillStyle=C.grass;cx.fillRect(0,HOR,W,H-HOR);
  const hz=cx.createLinearGradient(0,HOR,0,HOR+H*.18);hz.addColorStop(0,C.sky);hz.addColorStop(1,C.grass);
  cx.globalAlpha=.7;cx.fillStyle=hz;cx.fillRect(0,HOR,W,H*.18);cx.globalAlpha=1;
  band(60,2600,-1.75*L,1.75*L,'#4a3a26');
  band(60,2600,-1.6*L,1.6*L,C.road);
  const off=dist%280;
  for(let k=-1;k<18;k++){
    const z0=Math.max(60,60+k*140-off),z1=60+(k+1)*140-off;
    if(z1<=60)continue;
    if(k%2===0){
      band(z0,z1,-1.6*L,1.6*L,C.road2);
      for(const lx of[-.5*L,.5*L])band(z0,Math.min(z1,z0+70),lx-1.3,lx+1.3,'rgba(255,255,255,.4)');
    }
  }
  const items=[];
  for(const o of trees)if(o.z>90)items.push({z:o.z,f:()=>tree(o)});
  for(const o of obs)items.push({z:o.z+o.d/2,f:()=>({bar,low,train,crate,chevron,signal,gantry,ramp,spike:spikes})[o.type](o)});
  for(const c of coins)items.push({z:c.z,f:()=>coin(c)});
  for(const p of pwr)items.push({z:p.z,f:()=>plane(p.lane*L,38+Math.sin(t*4)*6,p.z,1)});
  items.push({z:ZM,f:()=>{if(flyT>0)plane(px,man.y+8,ZM,1.5);if(!(inv>0&&Math.floor(t*14)%2))person(px,man.y,ZM,t,'man',man.sl)}});
  items.push({z:ZM-gapz,f:()=>{if(gy>20)plane(gx1,gy+8,ZM-gapz,1.3);person(gx1,gy,ZM-gapz,t+1,HATS[gh],0)}});
  items.push({z:ZM-gapz-14,f:()=>{if(gy>20)plane(gx2+14,gy*.92+8,ZM-gapz-14,1.3);person(gx2+14,gy*.92,ZM-gapz-14,t,HATS[(gh+1)%HATS.length],0)}});
  items.sort((a,b)=>b.z-a.z);
  for(const it of items)it.f();
  if(flyT>0&&state==='play'){cx.fillStyle=C.cloud;cx.globalAlpha=.7;for(const c of fcl)cloudAt(c.x*W,c.y*H,c.s*W*.1);cx.globalAlpha=1}
  if(state!=='play')return;
  cx.fillStyle='#fff';cx.strokeStyle='rgba(0,0,0,.55)';cx.lineWidth=3;
  const txt=(s,x,y,al,fs)=>{cx.textAlign=al;cx.font=fs;cx.strokeText(s,x,y);cx.fillText(s,x,y)};
  txt(Math.floor(dist/15)+' м',16,34,'left','700 22px system-ui,sans-serif');
  txt('Монеты: '+cn,16,58,'left','600 15px system-ui,sans-serif');
  if(state==='play'&&sh>0)txt('Щит: '+sh,16,80,'left','600 15px system-ui,sans-serif');
  txt('Рекорд: '+S.best+' м',W-16,30,'right','14px system-ui,sans-serif');
  txt('Уровень '+lvl,W-16,52,'right','14px system-ui,sans-serif');
  txt('Гномы',W-16,76,'right','14px system-ui,sans-serif');
  cx.fillStyle='rgba(0,0,0,.35)';cx.fillRect(W-116,84,100,10);
  cx.fillStyle=gapz<25?'#c8372d':'#3f8f4e';cx.fillRect(W-116,84,Math.max(0,gapz/MAXG*100),10);
  if(lvT>0&&state==='play'){cx.fillStyle='#fff';txt('Уровень '+lvl+'!',W/2,H*.22,'center','700 30px system-ui,sans-serif')}
  if(flyT>0){cx.fillStyle='#9fe3ff';txt('Полёт: '+Math.ceil(flyT)+' с',W/2,H*.36,'center','700 20px system-ui,sans-serif')}
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
